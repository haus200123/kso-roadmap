<title>Дорожная карта КСО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: рабочий инструмент — шапка с разделами, сводка → фильтры → таблица; карточка ТТ выезжает справа */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d9dfe7; --line-2:#e8ecf1;
  --fg:#15202c; --muted:#5d6b7c; --accent:#1d5bd8; --accent-soft:#e3ebfc; --on-accent:#ffffff;
  --ok:#1d8656; --ok-soft:#e1f3ea; --warn:#a86a10; --warn-soft:#fbf0dc; --bad:#c23a3a; --bad-soft:#fbe5e5;
  --teal:#0d7f86; --teal-soft:#dff2f3; --violet:#6c45c9; --violet-soft:#ece6fa; --grey-soft:#e9edf2;
  --shadow:0 12px 40px rgba(20,32,48,.18);
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#151c24; --surface-2:#1b242e; --line:#2a3542; --line-2:#222c37;
  --fg:#e5eaf0; --muted:#94a2b3; --accent:#6f9dff; --accent-soft:#1d2c4a; --on-accent:#0b1220;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2a744; --warn-soft:#3a2c14; --bad:#ff7070; --bad-soft:#3d1c1e;
  --teal:#42c4cb; --teal-soft:#14343a; --violet:#a98bff; --violet-soft:#2a2246; --grey-soft:#222c37;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --surface-2:#1b242e; --line:#2a3542; --line-2:#222c37;
  --fg:#e5eaf0; --muted:#94a2b3; --accent:#6f9dff; --accent-soft:#1d2c4a; --on-accent:#0b1220;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2a744; --warn-soft:#3a2c14; --bad:#ff7070; --bad-soft:#3d1c1e;
  --teal:#42c4cb; --teal-soft:#14343a; --violet:#a98bff; --violet-soft:#2a2246; --grey-soft:#222c37;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-num);font-size:11px;font-weight:600}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}
@media (max-width:700px){.tabs{order:3;flex:1 1 100%}.top .wrap{gap:8px;justify-content:space-between}}
.tab{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}

.banner{font-size:12.5px;color:var(--muted);padding-block:10px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.banner b{color:var(--fg);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}

main{padding-block:14px 60px}
h1{font-size:22px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* сводка */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
button.stat:hover{border-color:var(--accent)}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.r .sub{white-space:nowrap}
.addr{font-weight:600}
.sub{font-size:12px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-none{background:var(--grey-soft);color:var(--muted)}
.s-prep{background:var(--accent-soft);color:var(--accent)}
.s-ready{background:var(--teal-soft);color:var(--teal)}
.s-onsite{background:var(--violet-soft);color:var(--violet)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--bad);margin-top:4px}
.flag::before{content:"!";display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--bad);color:var(--surface);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap;background:var(--surface)}
.chip.fmt{border-color:transparent;background:var(--surface-2);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;width:110px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.due-bad{color:var(--bad);font-weight:600}
.due-soon{color:var(--warn);font-weight:600}

/* таймлайн */
.tl{position:relative;min-width:900px}
.tl-head,.tl-row{display:grid;grid-template-columns:240px 1fr}
.tl-head{border-bottom:1px solid var(--line);background:var(--surface-2);font-size:11px;color:var(--muted)}
.tl-name{padding:8px 12px;border-right:1px solid var(--line-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:36px}
.tl-row{border-bottom:1px solid var(--line-2);cursor:pointer}
.tl-row:hover{background:var(--surface-2)}
.tl-weeks{position:relative;height:30px}
.tl-weeks span{position:absolute;top:8px;transform:translateX(4px);white-space:nowrap}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7;z-index:2}
.tl-prep{position:absolute;top:13px;height:10px;border-radius:5px;opacity:.35}
.tl-dot{position:absolute;top:9px;width:18px;height:18px;margin-left:-9px;border-radius:5px;transform:rotate(45deg);border:2px solid var(--surface)}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}

/* карточка ТТ */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.dr-head .t{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.dr-body{padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.meta label > *{color:var(--fg);font-size:14px}

.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.qbox{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.qbox h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.q span{min-width:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.step button{border:0;background:none;width:30px;height:30px;font-size:16px;color:var(--muted)}
.step button:hover{color:var(--accent)}
.step button:disabled{opacity:.3;cursor:default}
.step input{width:44px;border:0;text-align:center;padding:4px 0;font-family:var(--f-num);background:none;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{appearance:none}
.step.changed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.orig{font-size:11px;color:var(--accent);font-family:var(--f-num)}

.bal td{padding:7px 10px}
.bal th{padding:7px 10px}
.st-ok{color:var(--ok);font-weight:600}
.st-def{color:var(--bad);font-weight:600}
.st-exc{color:var(--warn);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{color:var(--on-accent);filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn)}
.issue.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.src{font-size:13px;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;border:1px dashed var(--line)}

/* чек-лист */
.ck{display:flex;flex-direction:column}
.ck-item{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);align-items:start}
.ck-item:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.box.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.box.on::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.box.blk{border-color:var(--bad);background:var(--bad-soft)}
.ck-text{min-width:0}
.ck-text .tx{font-weight:500}
.ck-item.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ck-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px;align-items:center}
.ck-meta input[type=number]{width:52px;padding:2px 5px;font-size:12px}
.ck-meta select{padding:2px 5px;font-size:12px}
.ck-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;font-size:12px;color:var(--muted)}
.ico:hover{color:var(--accent);border-color:var(--accent)}
.req{color:var(--bad);font-weight:700}
.ck-group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:12px 0 4px;display:flex;justify-content:space-between}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 200px}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.log div{display:grid;grid-template-columns:120px 1fr;gap:10px}
.inner-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.inner-tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.inner-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* инженер */
.eng{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eng-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.eng-head select{font-size:15px;padding:9px}
.eng-group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.eng-group > .gh{padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.eng-group.locked{opacity:.55}
.eng-item{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.eng-item:last-child{border-bottom:0}
.eng-item .box{width:34px;height:34px;border-radius:9px}
.eng-item .box.on::after{width:8px;height:15px;border-width:0 3px 3px 0}
.eng-item .tx{font-size:15px;font-weight:500}
.eng-tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.eng-tools .ico{padding:6px 10px;font-size:13px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.eng-close{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.eng-close .btn{width:100%;padding:14px;font-size:16px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
@media (max-width:640px){
  .dr-body{padding:12px 12px 40px}.dr-head{padding:12px}
  .ck-item{grid-template-columns:26px 1fr}.ck-acts{grid-column:2;justify-content:flex-start}
  .log div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer.anim{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="brand-mark">КСО</span>Дорожная карта</div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <label class="role">Роль
      <select id="role">
        <option value="manager">Менеджер</option>
        <option value="engineer">Инженер ТП</option>
        <option value="admin">Администратор</option>
      </select>
    </label>
  </div>
</header>
<div class="wrap">
  <div class="banner"><span><b>Прототип.</b> Адреса, юрлица и количества — из вашей таблицы. Даты выездов, ответственные и отметки в чек-листах — примерные. Изменения сохраняются только в этом браузере.</span><button class="linkbtn" id="reset">Сбросить к данным таблицы</button></div>
</div>
<main class="wrap" id="main"></main>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script>
(function(){
"use strict";
/* ---------- исходные данные из таблицы ---------- */
const UL = {V:"ООО «Альфа»",P:"ООО «Бета»",L:"ООО «Гамма»",S:"ООО «Дельта»",N:"ООО «Омега»",R:"ООО «Сигма»",PS:"ООО «Каппа»"};
// [формат, город, адрес, ЮЛ, skit, csik, csikFrom, ncr, demCsik, lin, rTerm, rKkt, rCol, oTerm, oKkt, oFn, oCol, oGaz, прочее[], примечание, исходный комментарий]
const RAW = [
 ["Реми","Пилотск","Сосновая, 54","V",8,0,null,4,0,0,4,4,0,4,4,4,8,0,[],"",
  "1) Необходимо демонтировать 4 NCR, с них снимаем ККТ и терминалы Сбербанк для дальнейшего использования.\n2) Запаковываем кассы NCR, делаем фото и передаём логистам для отправки на склад.\n3) Проверяем наличие терминалов Сбербанк, а также настроенных ККТ для дополнительных касс (в данном случае 4 терминала и 4 ККТ).\n4) При необходимости демонтируем линейные кассы (в данном случае не требуется).\n5) После физической установки кассы проводим настройку софт-части КСО по инструкциям.\n6) После настройки проверяем полную работоспособность кассы (тесты продажи, маркированного и ЕГАИС-товара, работу ТСПиОТ и его регистрацию, сканеры товаров и бейджей, звук и воспроизведение рекламы).\n7) Итог: демонтированы 4 NCR, установлены и полностью настроены 8 КСО s.kit."],
 ["Реми","Пилотск","Кедровая, 41В","P",8,0,null,4,0,0,4,4,0,4,4,4,8,0,[],"",""],

const DAY=864e5;
function todayISO(){const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()))}
function iso(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addD(s,n){return iso(new Date(pd(s).getTime()+n*DAY))}
function diffD(a,b){return Math.round((pd(a)-pd(b))/DAY)}
function fd(s){if(!s)return"—";const [y,m,d]=s.split("-");return d+"."+m+"."+y}
function nowStamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return fd(iso(d))+" "+p(d.getHours())+":"+p(d.getMinutes())}

function fresh(){
  const tts=RAW.map((r,i)=>{
    const [fmt,city,addr,ul,skit,csik,csikFrom,ncr,demCsik,lin,rTerm,rKkt,rCol,oTerm,oKkt,oFn,oCol,oGaz,other,note,src]=r;
    const t={id:"t"+(i+1),fmt,city,addr,ul:UL[ul],skit,csik,csikFrom,ncr,demCsik,lin,rTerm,rKkt,rCol,oTerm,oKkt,oFn,oCol,oGaz,
      other:other.map(o=>({...o})),note,src,date:addD(TODAY,OFFS[i]),manager:MANAGERS[["Пилотск","Демоград","Примерск"].includes(city)?0:1],
      engineer:ENGINEERS[i%3],chk:{},prepEdit:{},custom:[],closed:false,log:[]};
    t.bag=(ncr>0||fmt==="Реми Сити")?2:1;
    t.orig=snapshotQty(t);
    return t;
  });
  const byId=Object.fromEntries(tts.map(t=>[t.id,t]));
  S={tts,byId};
  // примерные отметки
  tts.forEach((t,i)=>{
    const prep=prepItems(t);
    const mark=(k,dt,by)=>{t.chk[k]={done:true,at:fd(dt),by}};
    if(i===0){prep.forEach(p=>mark(p.key,p.due,t.manager));onsiteFlat(t).forEach(o=>mark(o.key,t.date,t.engineer));t.closed=true;t.log.push([fd(t.date)+" 17:40",t.engineer+": этап «Работы на месте» закрыт, ТТ завершена"]);return}
    if(i===1){prep.forEach(p=>mark(p.key,p.due,t.manager));onsiteFlat(t).slice(0,9).forEach(o=>mark(o.key,t.date,t.engineer));t.log.push([fd(t.date)+" 10:15",t.engineer+": начаты работы на месте"]);return}
    if(i===4){prep.forEach(p=>mark(p.key,p.due,t.manager));t.log.push([fd(addD(t.date,-1))+" 16:00",t.manager+": подготовка завершена"]);return}
    if(i===3){prep.forEach(p=>{if(p.key!=="p4c"&&p.due<TODAY)mark(p.key,p.due,t.manager)});return}
    if(i===2){prep.forEach(p=>{if(["p1","p2"].includes(p.key))mark(p.key,p.due,t.manager)});t.chk.p4c={blocked:true,reason:"Поставщик не подтвердил срок поставки колонок"};t.log.push([fd(addD(TODAY,-1))+" 12:05",t.manager+": «Заказать колонки» — заблокировано"]);return}
    prep.forEach(p=>{if(p.due<TODAY)mark(p.key,p.due,t.manager)});
  });
  tts.forEach(t=>t.chk&&Object.entries(t.chk).forEach(([k,v])=>{if(v.done&&k.startsWith("p")&&t.log.length<4)t.log.push([v.at+" 11:00",v.by+": отмечено «"+(prepItems(t).find(p=>p.key===k)||{text:k}).text+"»"])}));
}

function ttName(id){const t=S.byId[id];return t?t.addr:"—"}

function derive(t){
  const kso=t.skit+t.csik;
  const dem=t.ncr+t.demCsik+t.lin;
  const out=transfersOut(t.id);
  const toWarehouse=t.ncr+t.lin+Math.max(0,t.demCsik-out);
  const need={term:kso,kkt:kso,fn:kso,col:t.skit};
  const reuse={term:t.rTerm,kkt:t.rKkt,fn:t.rKkt,col:t.rCol};
  const order={term:t.oTerm,kkt:t.oKkt,fn:t.oFn,col:t.oCol};
  return {kso,dem,toWarehouse,need,reuse,order,out};
}
function transfersOut(id){return S.tts.filter(x=>x.csikFrom===id).reduce((a,x)=>a+x.csik,0)}
const BAL=[["term","Терминал Сбербанка"],["kkt","ККТ"],["fn","ФН"],["col","Колонки (S.kit)"]];
function balance(t){
  const d=derive(t);
  return BAL.map(([k,label])=>{const have=d.reuse[k]+d.order[k];return {k,label,need:d.need[k],reuse:d.reuse[k],order:d.order[k],diff:have-d.need[k]}});
}
function issues(t){
  const d=derive(t), L=[];
  balance(t).forEach(b=>{
    if(b.diff<0)L.push({bad:true,t:`${b.label}: не хватает ${-b.diff} шт. (нужно ${b.need}, с демонтажа ${b.reuse}, заказ ${b.order})`});
    else if(b.diff>0)L.push({bad:false,t:`${b.label}: сверх потребности ${b.diff} шт. (нужно ${b.need}, с демонтажа ${b.reuse}, заказ ${b.order})`});
  });
  if(t.rTerm>d.dem||t.rKkt>d.dem)L.push({bad:true,t:`С демонтажа берём больше терминалов/ККТ, чем снимаем касс (${d.dem})`});
  if(t.rCol>t.ncr)L.push({bad:true,t:`Колонок с NCR берём ${t.rCol}, а NCR снимаем ${t.ncr}`});
  if(t.demCsik>0&&d.out!==t.demCsik)L.push({bad:false,t:`Снимаем ${t.demCsik} CSIK, на другие ТТ переезжает ${d.out}`+(d.out<t.demCsik?` — ${t.demCsik-d.out} без назначения`:"")});
  if(t.csik>0&&t.csikFrom){const src=S.byId[t.csikFrom];const avail=src.demCsik-transfersOut(src.id)+t.csik;if(t.csik>avail)L.push({bad:true,t:`На ${src.addr} снимается только ${src.demCsik} CSIK — не хватает для переноса`})}
  if(t.note)L.push({bad:false,t:t.note,src:true});
  return L;
}

  if(t.closed)st="done";else if(od>0)st="onsite";else if(pd_===prep.length)st="ready";else if(pd_>0)st="prep";

  const pct=Math.round(100*(pd_+od)/(prep.length+on.length));
  return {prep,on,pd:pd_,od,overdue,blocked,next,st,problem,pct,iss};
}

function timeline(rows){
  if(!rows.length)return `<div class="panel empty">Под фильтры не попала ни одна ТТ.</div>`;
  const dates=rows.map(r=>r.t.date);
  let start=addD(dates.reduce((a,b)=>a<b?a:b),-16);if(TODAY<start)start=addD(TODAY,-3);
  let end=addD(dates.reduce((a,b)=>a>b?a:b),5);if(TODAY>end)end=addD(TODAY,3);
  // выравнивание на понедельник
  const sd=pd(start);start=addD(start,-((sd.getDay()+6)%7));
  const span=diffD(end,start)+1;
  const pct=s=>(diffD(s,start)/span*100);
  const weeks=[];for(let s=start;s<=end;s=addD(s,7))weeks.push(s);
  const grid=weeks.map(w=>`<div class="tl-grid" style="left:${pct(w)}%"></div>`).join("");
  const today=`<div class="tl-today" style="left:${pct(TODAY)}%" title="Сегодня"></div>`;
  return `<div class="panel scroll"><div class="tl">
   <div class="tl-head"><div class="tl-name">ТТ · дата выезда</div><div class="tl-weeks">${weeks.map(w=>`<span style="left:${pct(w)}%">${fd(w).slice(0,5)}</span>`).join("")}</div></div>
   ${rows.map(({t,i})=>{const c=STC[i.st];const ps=addD(t.date,-14);
     return `<div class="tl-row" data-open="${t.id}" tabindex="0"><div class="tl-name"><b>${esc(t.addr)}</b> <span class="muted">· ${esc(t.city)} · ${fd(t.date).slice(0,5)}</span></div>
     <div class="tl-track">${grid}${today}<div class="tl-prep" style="left:${pct(ps)}%;width:${14/span*100}%;background:${c}"></div><div class="tl-dot" style="left:${pct(t.date)+.5/span*100}%;background:${c}" title="${fd(t.date)} · ${ST[i.st]}"></div>${i.problem?`<div style="position:absolute;top:9px;left:calc(${pct(t.date)}% + 14px)" class="flag" title="Есть проблема"></div>`:""}</div></div>`}).join("")}
  </div>
  <div class="tl-legend"><span>▬ подготовка (Д-14 … Д)</span><span>◆ работы на месте</span>${Object.entries(ST).map(([k,l])=>`<span><span class="pill s-${k}">${l}</span></span>`).join("")}<span style="color:var(--bad)">┃ сегодня</span></div></div>`;
}

/* ---------- события ---------- */
function cur(){return S.byId[UI.open]}
const QL={skit:"КСО S.kit",csik:"CSIK (перенос)",ncr:"Демонтаж NCR",demCsik:"Демонтаж CSIK",lin:"Демонтаж лин. касс",rTerm:"Терминалы с демонтажа",rKkt:"ККТ с демонтажа",rCol:"Колонки с NCR",oTerm:"Заказ терминалов",oKkt:"Заказ ККТ",oFn:"Заказ ФН",oCol:"Заказ колонок",oGaz:"Заказ меток ДемоБанк"};
function setQty(t,f,v){v=Math.max(0,Math.min(999,Math.round(+v||0)));if(t[f]===v)return;logIt(t,`${QL[f]}: ${t[f]} → ${v}`);t[f]=v;if(f==="csik"&&v===0)t.csikFrom=null;commit()}
function commit(){save();render()}
function align(t){const d=derive(t);const nv={oTerm:Math.max(0,d.need.term-t.rTerm),oKkt:Math.max(0,d.need.kkt-t.rKkt),oFn:Math.max(0,d.need.fn-t.rKkt),oCol:Math.max(0,d.need.col-t.rCol)};
  const ch=Object.entries(nv).filter(([k,v])=>t[k]!==v);ch.forEach(([k,v])=>{logIt(t,`${QL[k]}: ${t[k]} → ${v} (выравнивание)`);t[k]=v});return ch.length}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-open],.scrim");if(!b)return;
  const ds=b.dataset;
  if(ds.view){UI.view=ds.view;UI.cmt=null;saveUI();render();scrollTo(0,0);return}
  if(ds.mode){UI.mode=ds.mode;saveUI();render();return}
  if(ds.quick!==undefined){UI.quick=UI.quick===ds.quick?"":ds.quick;render();return}
  if(ds.open){UI.anim=true;UI.open=ds.open;UI.cardTab="prep";UI.cmt=null;renderDrawer();return}
  if(ds.ctab){UI.cardTab=ds.ctab;UI.cmt=null;renderDrawer();return}
  const act=ds.act;
  if(act==="close"){UI.open=null;UI.cmt=null;renderDrawer();return}
  if(act==="copy-order"){const txt=orderTSV();navigator.clipboard?.writeText(txt).then(()=>toast("Сводка скопирована — вставьте в Excel"),()=>toast("Не удалось скопировать: браузер запретил доступ к буферу"));return}
  if(act==="align-all"){let n=0;S.tts.forEach(t=>{if(align(t))n++});commit();toast(n?`Заказ выровнен на ${n} ${plural(n,"ТТ","ТТ","ТТ")}`:"Баланс уже сходится");return}
  if(act==="close-stage"){const t=S.byId[UI.engTT];t.closed=true;t.log.unshift([nowStamp(),roleName()+": этап «Работы на месте» закрыт, ТТ завершена"]);commit();toast("Этап закрыт. ТТ переведена в «Завершено»");return}
  if(act==="to-eng"){UI.engTT=UI.open;UI.open=null;UI.view="eng";saveUI();render();scrollTo(0,0);return}
  if(ds.eng){const t=S.byId[UI.engTT];const s=t.chk[ds.eng]||(t.chk[ds.eng]={});const it=onsiteFlat(t).find(x=>x.key===ds.eng);
    if(!s.done&&it.photo&&!s.photo){toast("Сначала приложите фото");return}
    s.done=!s.done;s.at=s.done?nowStamp():"";s.by=s.done?t.engineer:"";logIt(t,(s.done?"отмечено":"снята отметка")+" «"+it.text+"»");commit();return}
  if(ds.cmt){UI.cmt=UI.cmt===ds.cmt&&UI.cmtMode==="cmt"?null:ds.cmt;UI.cmtMode="cmt";render();$("#cmt-text")?.focus();return}
  if(ds.cmtCancel!==undefined){UI.cmt=null;render();return}
  if(ds.cmtSave){const t=UI.view==="eng"&&!UI.open?S.byId[UI.engTT]:cur();const s=t.chk[ds.cmtSave]||(t.chk[ds.cmtSave]={});const v=$("#cmt-text").value.trim();
    if(UI.cmtMode==="block"){s.blocked=true;s.reason=v||"Причина не указана";logIt(t,"заблокировано: "+s.reason)}else{s.comment=v;logIt(t,"комментарий: "+v)}
    UI.cmt=null;commit();return}
  const t=cur();if(!t)return;
  if(ds.inc){setQty(t,ds.inc,t[ds.inc]+1);return}
  if(ds.dec){setQty(t,ds.dec,t[ds.dec]-1);return}
  if(ds.bag){const v=+ds.bag;if(t.bag!==v){logIt(t,`Пакетная зона S.kit: ${t.bag} → ${v}`);t.bag=v;commit()}return}
  if(act==="align"){const n=align(t);commit();toast(n?"Заказ пересчитан под потребность":"Баланс уже сходится");return}
  if(act==="reset-qty"){Object.entries(t.orig).forEach(([k,v])=>t[k]=v);logIt(t,"количества возвращены к данным таблицы");commit();return}
  if(ds.chk){const s=t.chk[ds.chk]||(t.chk[ds.chk]={});const p=prepItems(t).find(x=>x.key===ds.chk);s.done=!s.done;if(s.done){s.blocked=false;s.at=fd(TODAY);s.by=t.manager}logIt(t,(s.done?"отмечено":"снята отметка")+" «"+p.text+"»");commit();return}
  if(ds.block){const s=t.chk[ds.block]||(t.chk[ds.block]={});if(s.blocked){s.blocked=false;s.reason="";logIt(t,"блокировка снята");commit()}else{UI.cmt=ds.block;UI.cmtMode="block";renderDrawer();$("#cmt-text")?.focus()}return}
  if(ds.del){const p=prepItems(t).find(x=>x.key===ds.del);if(p.custom)t.custom=t.custom.filter(c=>c.key!==p.key);else(t.prepEdit[p.key]||(t.prepEdit[p.key]={})).removed=true;logIt(t,"удалён пункт «"+p.text+"»");commit();return}
  if(act==="add-item"){const v=$("#new-item").value.trim();if(!v){$("#new-item").focus();return}const off=Math.max(0,+$("#new-off").value||0);t.custom.push({key:"c"+Date.now(),text:v,off,resp:"Менеджер"});logIt(t,"добавлен пункт «"+v+"»");commit();return}
});
document.addEventListener("keydown",e=>{

  if(ds.off){const e_=t.prepEdit[ds.off]||(t.prepEdit[ds.off]={});const c=t.custom.find(x=>x.key===ds.off);const v=Math.max(0,+el.value||0);if(c)c.off=v;else e_.off=v;logIt(t,"срок пункта изменён на Д-"+v);commit();return}
  if(ds.resp){const c=t.custom.find(x=>x.key===ds.resp);if(c)c.resp=el.value;else(t.prepEdit[ds.resp]||(t.prepEdit[ds.resp]={})).resp=el.value;logIt(t,"ответственный: "+el.value);commit();return}
});

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};img.src=r.result};r.readAsDataURL(file)})}
