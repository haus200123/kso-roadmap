<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дорожная карта КСО</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d5bd8'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Шрифты системные: сайт работает без интернета */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d9dfe7; --line-2:#e8ecf1;
  --fg:#15202c; --muted:#5d6b7c; --accent:#1d5bd8; --accent-soft:#e3ebfc; --on-accent:#ffffff;
  --ok:#1d8656; --ok-soft:#e1f3ea; --warn:#a86a10; --warn-soft:#fbf0dc; --bad:#c23a3a; --bad-soft:#fbe5e5;
  --shadow:0 12px 40px rgba(20,32,48,.18);
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1319; --surface:#151c24; --surface-2:#1b242e; --line:#2a3542; --line-2:#222c37;
  --fg:#e5eaf0; --muted:#94a2b3; --accent:#6f9dff; --accent-soft:#1d2c4a; --on-accent:#0b1220;
  --ok:#4cc38a; --ok-soft:#173327; --warn:#e2a744; --warn-soft:#3a2c14; --bad:#ff7070; --bad-soft:#3d1c1e;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{color:var(--on-accent);filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.req{color:var(--bad);font-weight:700}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-num);font-size:11px;font-weight:700;flex:none}

.login{min-height:100vh;display:grid;place-items:center;padding:40px 16px}
.lcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lcard h1{margin:0;font-size:22px}
.lcard label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.lcard label input{font-size:15px;padding:10px 12px;color:var(--fg)}
.lcard .row{display:flex;gap:8px;flex-wrap:wrap}
.lcard .row input{flex:1 1 180px}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13.5px!important;color:var(--fg)!important}
.chk input{width:18px;height:18px;margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13px;min-height:1em}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:34px;display:grid;place-items:center}
.bell svg{width:18px;height:18px}
.bell .cnt{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.notif{position:absolute;right:16px;top:calc(100% + 6px);width:min(440px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30}
.notif h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.ni{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.ni .acts{display:flex;gap:6px;flex-wrap:wrap}
.offline{background:var(--bad);color:#fff;text-align:center;font-size:13.5px;font-weight:600;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
@media (max-width:1440px){.tabs{order:3;flex:1 1 100%}.top .wrap{justify-content:space-between}}

main{padding-block:16px 60px}
h1.pg{font-size:20px;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 240px}
.notice{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border-left:3px solid var(--warn);margin-bottom:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;background:var(--surface-2)}

.tts{display:flex;flex-direction:column;gap:8px}
.tt{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.tt.open{border-color:var(--accent)}
.tth{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.tth:hover{background:var(--surface-2);border-radius:12px}
.chev{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.tt.open .chev{transform:rotate(90deg)}
.ttn{min-width:0}
.ttn .nm{font-weight:700;font-size:15px}
.ttn .mt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:2px}
.ttn .mt b{color:var(--fg);font-weight:600}
.ttr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ttr input[type=date]{padding:5px 8px;font-family:var(--f-num)}
.date{font-family:var(--f-num);font-weight:700}
.date.none{font-family:var(--f-ui);font-weight:400;color:var(--muted);font-size:12.5px}
.prog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;width:80px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.badge{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.ttb{border-top:1px solid var(--line-2);padding:14px;display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.bar-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 200px}
.bar-row label > *{color:var(--fg)}
details.params{border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2)}
details.params summary{padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:4px 12px 12px}
.pgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.pgrid label > *{color:var(--fg)}
.pgrid .wide{grid-column:1/-1}
.qline{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);border-left:3px solid var(--warn)}

.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 0 4px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.it{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.box:hover:not(:disabled){border-color:var(--accent)}
.box.on{background:var(--ok);border-color:var(--ok)}
.box.on::after,.box.pend::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.box.pend{background:var(--warn-soft);border-color:var(--warn)}
.box.pend::after{border-color:var(--warn)}
.box:disabled{cursor:default}
.it .tx{font-weight:500;padding-top:4px}
.it.done .tx{color:var(--muted)}
.st{font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.st .ok{color:var(--ok)} .st .pd{color:var(--warn);font-weight:700} .st .rj{color:var(--bad)}
.due{font-family:var(--f-num);font-size:12px}
.due.over{color:var(--bad);font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.ico:hover{color:var(--accent);border-color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumb{position:relative;border:0;padding:0;background:none}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumb span{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:0 0 8px 8px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fio-warn{font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:8px;background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--fg)}
.fio-err{color:var(--bad);font-size:12.5px;min-height:1em}
.lcard input.bad{border-color:var(--bad)}
.tp{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.tp-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.tp-city{display:flex;flex-direction:column;gap:4px}
.tp-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 12px;padding-left:22px}
.tp label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.tp input[type=checkbox]{width:16px;height:16px;margin:0;flex:none}
.resp{color:var(--accent)}
.adm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.eds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr) auto;gap:6px;align-items:center;padding:3px 0 3px 22px}
.eds-add{display:flex;gap:6px;padding:4px 0 10px 22px;flex-wrap:wrap}
.eds-add input{flex:1 1 220px}
@media (max-width:700px){.eds{grid-template-columns:1fr auto}.eds > input:nth-child(2){grid-column:1/-1;grid-row:2}}
.ico.danger{color:var(--bad);border-color:var(--bad)}
.subs{margin-top:8px;border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column}
.si{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.si:last-child{border-bottom:0}
.si .tx{font-weight:400;padding-top:1px;overflow-wrap:anywhere}
.it .tx{overflow-wrap:anywhere}
.box.sm{width:22px;height:22px;border-radius:6px}
.box.sm.on::after,.box.sm.pend::after{width:5px;height:10px;border-width:0 2.5px 2.5px 0}
.box.auto{border-style:dashed}
.cm{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.cm .c{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .c .h{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;white-space:normal}
.cm textarea{min-height:56px}
.wiki{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:7px 12px;background:var(--accent-soft)}
.wiki:hover{filter:brightness(1.05)}
a.ico{text-decoration:none}
.ico.on{color:var(--accent);border-color:var(--accent)}
.ed2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 8px;border-bottom:1px solid var(--line-2)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 150px 60px auto;gap:6px;align-items:center;padding:6px 0 4px}
.ed.noprep{grid-template-columns:minmax(0,1fr) 150px auto}
.ed .flags{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ed .flags label{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
@media (max-width:700px){.ed,.ed.noprep{grid-template-columns:1fr 1fr}.ed > input:first-child{grid-column:1/-1}}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addrow input[type=text]{flex:1 1 220px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pick select{font-size:15px;padding:10px}
.lb{position:fixed;inset:0;background:rgba(5,9,14,.88);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.lb img{max-width:100%;max-height:80vh;border-radius:8px}
.lb .cap{color:#fff;font-size:13px;text-align:center}
.lb .acts{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:13.5px;max-width:calc(100% - 32px)}
/* волны */
.waves{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wv{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.wv:hover{border-color:var(--accent);color:var(--accent)}
.wv[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wv .n{font-family:var(--f-num);font-weight:700;opacity:.8}
.wv-act{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.wv-act input{width:170px}
.wtag{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.code{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
/* быстрые количества */
.qp{border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.qp{padding:0;display:block}
.qp summary{padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.qp summary .sub{font-weight:400}
.qp .qb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.pick .bar-row select{font-size:inherit;padding:7px 10px}
.qrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.qrow > b{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:100%;margin-bottom:-4px}
.qf{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.qf .st2{display:flex;align-items:center}
.qf input[type=number]{width:58px;text-align:center;padding:5px 4px;border-radius:0;font-family:var(--f-num);font-weight:700}
.qf select{padding:5px 6px}
.qf .pm{width:28px;height:32px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0;color:var(--fg)}
.qf .pm:first-child{border-radius:8px 0 0 8px;border-right:0}.qf .pm:last-child{border-radius:0 8px 8px 0;border-left:0}
.qf .pm:hover{color:var(--accent)}
.qf.auto input[type=number]{background:var(--ok-soft)}
.kkt-sum{font-size:12px}
.kkt-sum.bad{color:var(--bad);font-weight:700}
.note{white-space:pre-line}
/* быстрые пункты */
.grp .gadd{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:0 4px;text-transform:none;letter-spacing:0}
.iedit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.iedit input[type=text]{flex:1 1 260px}
.iedit label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.iadd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.iadd input[type=text]{flex:1 1 260px}
/* календарь */
.cal-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cal-h h1{margin:0;font-size:20px;min-width:180px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.cal .wd{background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:6px 8px;text-align:center}
.cal .dc{background:var(--surface);min-height:96px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;margin:0 1px 1px 0}
.cal .dc.out{background:var(--surface-2)}
.cal .dc.out .dn{opacity:.45}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--muted)}
.cal .ev,.agenda .ev{border:0;text-align:left;font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev.w-0{background:var(--surface-2);color:var(--fg)}
.ev.w-1{background:#e3ebfc;color:#1d4fb8}.ev.w-2{background:#e1f3ea;color:#16704a}.ev.w-3{background:#fbf0dc;color:#8a560c}.ev.w-4{background:#f1e6fb;color:#6b3aa0}
@media (prefers-color-scheme:dark){.ev.w-1{background:#1d2c4a;color:#9dbbff}.ev.w-2{background:#173327;color:#7fd8aa}.ev.w-3{background:#3a2c14;color:#f0c27a}.ev.w-4{background:#2f2140;color:#cfa8f5}}

<body>
<div id="net-root" style="position:fixed;left:0;right:0;bottom:0;z-index:80"></div>
<div id="app"></div>
<div id="toast-root"></div>
<script src="/lib/common.js"></script>
<script>
(function(){
"use strict";
const {fd,addD,plural,tok,qtyLine,groups,orderRows,ORDER_COLS,SEC,SECX,ROLE}=KSO;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=3200){const r=$("#toast-root");r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",ms)}

const S={qpOpen:new Set(),waves:[],wave:"all",waveNew:false,waveRen:false,waveDel:false,cal:null,itemEdit:null,itemAdd:null,itemDel:null,userDel:null,me:null,people:[],limited:false,respEdit:null,COMMENTS:{},wikiRoot:"",cmtOpen:new Set(),subAdd:null,subEdit:null,subDel:null,view:"onsite",q:"",open:new Set(),edit:null,notifOpen:false,TT:{},LISTS:{},CHECKS:{},PH:{},v:0,today:"",loaded:false,
  lb:null,newTT:false,confirmDel:null,confirmReset:null,rejecting:null,paramsOpen:null,engTT:null,lastPending:null,offline:false,users:null,journal:null,jq:"",userEdit:null};
try{S.engTT=sessionStorage.getItem("kso-eng-tt");const w=sessionStorage.getItem("kso-wave");if(w!==null)S.wave=w}catch(e){}

/* ---------- вход: отдельная сессия для каждого окна ----------
   Токен хранится в памяти окна и в sessionStorage. Если браузеру запрещено хранилище сайта,
   работает cookie сервера. Если прокси вырезает заголовки — токен уходит ещё и параметром ?s=. */
const TK="kso-tok",RK="kso-remember";let memTok=null;
const STORE_OK=(()=>{try{sessionStorage.setItem("kso-t","1");const ok=sessionStorage.getItem("kso-t")==="1";sessionStorage.removeItem("kso-t");localStorage.getItem(RK);return ok}catch(_){return false}})();
function getTok(){if(memTok)return memTok;if(!STORE_OK)return null;let t=null;try{t=sessionStorage.getItem(TK)}catch(_){}if(t)return memTok=t;
  try{const r=JSON.parse(localStorage.getItem(RK)||"null");if(r&&r.exp>Date.now()&&r.tok){try{sessionStorage.setItem(TK,r.tok)}catch(_){}return memTok=r.tok}if(r)localStorage.removeItem(RK)}catch(_){}return null}
function setTok(t,ttl){memTok=t;if(!STORE_OK)return;try{sessionStorage.setItem(TK,t)}catch(_){}if(ttl){try{localStorage.setItem(RK,JSON.stringify({tok:t,exp:Date.now()+ttl}))}catch(_){}}}
function clearTok(){const t=memTok;memTok=null;if(!STORE_OK)return;try{sessionStorage.removeItem(TK)}catch(_){}
  try{const r=JSON.parse(localStorage.getItem(RK)||"null");if(r&&(!t||r.tok===t))localStorage.removeItem(RK)}catch(_){}}
function au(path){const t=getTok();return t?path+(path.includes("?")?"&":"?")+"s="+encodeURIComponent(t):path}
/* ---------- сервер ---------- */
async function api(method,path,data){
  const h={};if(data)h["Content-Type"]="application/json";const tk=getTok();if(tk)h["X-KSO-Token"]=tk;
  let u=path==="/api/login"||path==="/api/login-engineer"?path:au(path);if(method==="GET")u+=(u.includes("?")?"&":"?")+"_="+Date.now();
  let r;try{r=await fetch(u,{method,headers:h,body:data?JSON.stringify(data):undefined,credentials:"same-origin",cache:"no-store"})}catch(e){throw new Error("Нет связи с сервером")}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=="/api/login"){clearTok();if(es)es.close();S.me=null;setOffline(false);S.loaded=false;render();throw new Error(j.error||"Войдите заново")}
  if(!r.ok)throw new Error(j.error||"Ошибка "+r.status);
  return j;
}
async function act(method,path,data,okMsg){try{const j=await api(method,path,data);await reload();if(okMsg)toast(okMsg);return j}catch(e){toast(e.message,5000);await reload().catch(()=>{});return null}}
let reloading=null;
async function reload(){
  if(reloading)return reloading;
  reloading=(async()=>{try{const j=await api("GET","/api/state");S.TT=j.tt;S.LISTS=j.lists;S.CHECKS=j.checks;S.PH={};Object.entries(j.photos).forEach(([id,p])=>{(S.PH[p.tt]=S.PH[p.tt]||[]).push({id,...p})});S.v=j.v;S.today=j.today;S.COMMENTS=j.comments||{};S.people=j.people||[];S.waves=j.waves||[];if(S.wave!=="all"&&S.wave!==""&&!S.waves.some(w=>w.id===S.wave))S.wave="all";S.limited=!!j.limited;S.wikiRoot=j.wikiRoot||"";const changed=!S.loaded||j.v!==S.v0;S.v0=j.v;S.loaded=true;setOffline(false);notifyPending();if(changed){if(S.view==="users"&&S.users&&isAdmin())refreshUsers();soft()}}finally{reloading=null}})();
  return reloading;
}
let es=null,esRetry=null;
/* Плашка «нет связи» живёт отдельно от страницы: появляется и пропадает сразу, даже пока вы печатаете */
function setOffline(v){S.offline=v;const r=$("#net-root");if(r)r.innerHTML=v&&S.me?`<div class="offline">Нет связи с сервером — изменения не сохраняются. Проверьте, что сайт запущен.</div>`:""}
function live(){
  if(es)es.close();
  es=new EventSource(au("/api/events"));
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.v!==S.v)reload().catch(()=>{})}catch(_){}};
  es.onerror=()=>{setOffline(true);if(es.readyState===2){clearTimeout(esRetry);esRetry=setTimeout(()=>{if(S.me)live()},5000)}};
  es.onopen=()=>{reload().catch(()=>{})};
}
setInterval(()=>{if(S.me)reload().catch(()=>setOffline(true))},30000);

/* ---------- вычисления ---------- */
const role=()=>S.me&&S.me.role;
const isAdmin=()=>role()==="admin",isLead=()=>role()==="lead",isEng=()=>role()==="engineer",isViewer=()=>role()==="viewer";
function items(id,sec){return ((S.LISTS[id]||{})[sec])||[]}
function chk(id,sec,iid){return (((S.CHECKS[id]||{})[sec])||{})[iid]||{st:"none"}}
const ckey=(iid,sid)=>sid?iid+"~"+sid:iid;
function isDone(id,sec,it){return it.sub&&it.sub.length?it.sub.every(x=>chk(id,sec,ckey(it.id,x.id)).st==="done"):chk(id,sec,it.id).st==="done"}
function comments(id,sec,key){return (S.COMMENTS[id]||[]).filter(c=>c.sec===sec&&c.key===key)}
function stats(id,sec){const L=items(id,sec);let done=0,pend=0,over=0;const t=S.TT[id]||{};
  L.forEach(i=>{const keys=i.sub&&i.sub.length?i.sub.map(x=>ckey(i.id,x.id)):[i.id];pend+=keys.filter(k=>chk(id,sec,k).st==="pending").length;
    if(isDone(id,sec,i))done++;else if(sec==="prep"&&t.date&&addD(t.date,+i.d||0)<S.today)over++});
  return {total:L.length,done,pend,over}}
function allPending(){const out=[];Object.keys(S.TT).forEach(id=>["onsite","prep"].forEach(sec=>items(id,sec).forEach(i=>{
  if(i.sub&&i.sub.length)i.sub.forEach(x=>{const c=chk(id,sec,ckey(i.id,x.id));if(c.st==="pending")out.push({id,sec,i,x,c})});
  else{const c=chk(id,sec,i.id);if(c.st==="pending")out.push({id,sec,i,c})}})));return out}
function notifyPending(){
  const n=allPending().length;
  document.title=(isLead()&&n?`(${n}) `:"")+"Дорожная карта КСО";
  if(isLead()&&S.lastPending!==null&&n>S.lastPending)toast(`Новая отметка инженера на проверку (всего ${n})`,5000);
  S.lastPending=n;
}
const waveName=w=>w?((S.waves.find(x=>x.id===w)||{}).name||"волна удалена"):"Без волны";
const waveIdx=w=>{const i=S.waves.findIndex(x=>x.id===w);return i<0?0:(i%4)+1};
const inWave=t=>isEng()||S.wave==="all"||(t.wave||"")===S.wave;
function setWave(w){S.wave=w;S.waveNew=S.waveRen=S.waveDel=false;try{sessionStorage.setItem("kso-wave",w)}catch(_){}}
function sortedIds(){const q=S.q.trim().toLowerCase();
  return Object.keys(S.TT).filter(id=>{const t=S.TT[id];return inWave(t)&&(!q||[t.name,t.city,t.ul,t.fmt,t.code,t.owner?.[S.view],t.exec?.[S.view]].join(" ").toLowerCase().includes(q))})
   .sort((a,b)=>{const A=S.TT[a],B=S.TT[b];if(A.date&&B.date&&A.date!==B.date)return A.date<B.date?-1:1;if(!!A.date!==!!B.date)return A.date?-1:1;return (A.order||0)-(B.order||0)})}

/* ---------- отрисовка ---------- */
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest("#app")&&a.matches("input[type=text],input[type=number],input[type=password],input[type=date],select,textarea")}
let deferred=false;
function soft(){if(editing())deferred=true;else render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(deferred&&!editing()){deferred=false;render()}},0));
/* ---------- черновики форм: введённое не теряется при обновлении страницы ---------- */
const DRAFT_SEL='[id^="n-"],[id^="nu-"],[id^="ue-"],[data-tp],[data-tp-all],[data-tp-q],#add-text,#add-g,#add-d,#rej-note,#jq,#wave-new,#wave-ren,[data-item-input],[data-item-new],[data-esnew],[data-cmt-input],[data-sub-new],[data-sub-input],[data-resp-input]';
S.drafts={};S.dropDrafts=[];
function draftKey(el){const d=el.dataset;
  if(d.tp)return "tp|"+d.tp+"|"+el.value;if(d.tpAll)return "tpall|"+d.tpAll;if(d.tpQ)return "tpq|"+d.tpQ;
  if(d.cmtInput)return "cmt|"+d.cmtInput;if(d.subNew)return "subnew|"+d.subNew;if(d.subInput)return "subin|"+d.subInput;if(d.respInput)return "resp|"+d.respInput;if(d.esnew)return "esnew|"+d.esnew;if(d.itemInput)return "iin|"+d.itemInput;if(d.itemNew)return "inew|"+d.itemNew;
  return el.id?"#"+el.id:null}
function dropDrafts(...prefixes){S.dropDrafts.push(...prefixes);prefixes.forEach(p=>Object.keys(S.drafts).forEach(k=>{if(k.startsWith(p))delete S.drafts[k]}))}
function snapDrafts(){document.querySelectorAll("#app "+DRAFT_SEL.split(",").join(",#app ")).forEach(el=>{if(el.type==="file")return;const k=draftKey(el);if(k)S.drafts[k]=el.type==="checkbox"?el.checked:el.value});
  S.dropDrafts.forEach(p=>Object.keys(S.drafts).forEach(k=>{if(k.startsWith(p))delete S.drafts[k]}));S.dropDrafts=[]}
function restoreDrafts(){
  document.querySelectorAll("#app "+DRAFT_SEL.split(",").join(",#app ")).forEach(el=>{const k=draftKey(el);if(!k||!(k in S.drafts))return;if(el.type==="checkbox")el.checked=!!S.drafts[k];else el.value=S.drafts[k]});
  document.querySelectorAll("[data-tp-all]").forEach(cb=>{const l=document.querySelector(`[data-tp-list="${cb.dataset.tpAll}"]`);if(l)l.hidden=cb.checked;tpSync(cb.dataset.tpAll)});
  document.querySelectorAll("[data-tp-q]").forEach(q=>{if(q.value)tpFilter(q.dataset.tpQ,q.value)});
  const nr=$("#nu-role"),nw=$("#nu-tpwrap");if(nr&&nw)nw.hidden=nr.value!=="lead";
  const er=$("#ue-role"),ew=$("#ue-tpwrap");if(er&&ew)ew.hidden=er.value!=="lead";
  if($("#n-preview"))newPreview();
}
function render(){
  const app=$("#app");
  const ae=document.activeElement,fk=ae&&ae.matches&&ae.matches(DRAFT_SEL)?draftKey(ae):null;let sel=null;try{if(fk)sel=[ae.selectionStart,ae.selectionEnd]}catch(_){}
  if(S.me)snapDrafts();
  if(!S.me){app.innerHTML=loginView();return}
  const y=window.scrollY;
  let body;
  if(S.view==="orders")body=ordersView();else if(S.view==="calendar")body=calendarView();else if(S.view==="users")body=usersView();else if(S.view==="journal")body=journalView();else body=mainView();
  app.innerHTML=headerView()+`<main class="wrap">${body}</main>`+(S.lb?lbView():"");
  restoreDrafts();
  {const nav=document.querySelector(".tabs"),a=nav&&nav.querySelector('[aria-selected="true"]');if(a&&nav.scrollWidth>nav.clientWidth&&(a.offsetLeft<nav.scrollLeft||a.offsetLeft+a.offsetWidth>nav.scrollLeft+nav.clientWidth))nav.scrollLeft=a.offsetLeft-12}
  if(fk){const el=[...document.querySelectorAll("#app "+DRAFT_SEL.split(",").join(",#app "))].find(x=>draftKey(x)===fk);if(el){el.focus({preventScroll:true});try{if(sel&&sel[0]!=null)el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  window.scrollTo(0,y);
}
function loginView(){
  return `<div class="login"><form class="lcard" id="login-form">
    <div style="display:flex;gap:10px;align-items:center"><span class="brand-mark">КСО</span><h1>Дорожная карта КСО</h1></div>
    <label>Логин<input type="text" id="lg-login" autocomplete="username"></label>
    <label>Пароль<input type="password" id="lg-pass" autocomplete="current-password"></label>
    <label class="chk"><input type="checkbox" id="lg-rem"> Запомнить меня на этом устройстве (72 часа)</label>
    <div class="err" id="lg-err"></div>
    <div class="sub">Демо-вход: <b>Admin</b> / admin · <b>Viewer</b> / viewer (только просмотр). Все данные вымышленные.</div>
    <button class="btn pri" type="submit" style="padding:11px;justify-content:center">Войти</button>
    <div class="or">или</div>
    <label>Инженер: фамилия и имя<span class="row"><input type="text" id="lg-fio" placeholder="Например, Петров Иван" autocomplete="name" maxlength="60"><button class="btn" type="button" id="lg-eng">Войти как инженер</button></span></label>
    <div class="fio-err" id="lg-fio-err" role="alert"></div>
    <div class="fio-warn">⚠ Вводите <b>настоящие фамилию и имя</b>. Работа на ТТ и отметки под вымышленным или неполным ФИО <b>не будут засчитаны в табель</b>.</div>
  </form></div>`;
}
const BELL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
function tabsFor(){const t=[["onsite",SEC.onsite]];if(!isEng())t.push(["prep",SEC.prep],["calendar","Календарь"],["orders","Сводка заказа"]);if(isAdmin())t.push(["users","Пользователи"],["journal","Журнал"]);return t}
function headerView(){
  const pend=isLead()?allPending():[];
  return `<header class="top"><div class="wrap">
    <div class="brand"><span class="brand-mark">КСО</span><span>Дорожная карта</span></div>
    <nav class="tabs" role="tablist">${tabsFor().map(([k,l])=>`<button class="tab" role="tab" data-view="${k}" aria-selected="${S.view===k}">${l}</button>`).join("")}</nav>
    <div class="who">
      ${isLead()?`<button class="bell" data-act="notif" aria-label="Отметки на проверку: ${pend.length}">${BELL}${pend.length?`<span class="cnt num">${pend.length}</span>`:""}</button>`:""}
      <span><b>${esc(S.me.name)}</b><br><span class="sub">${ROLE[S.me.role]}</span></span>
      <button class="btn sm" data-act="logout">Выйти</button>
    </div>
    ${isLead()&&S.notifOpen?notifView(pend):""}
  </div></header>`;
}
function notifView(pend){
  return `<div class="notif" role="dialog" aria-label="На проверку"><h3>Отметки инженеров на проверку · ${pend.length}</h3>
   ${pend.length?pend.map(p=>{const t=S.TT[p.id];const ph=(S.PH[p.id]||[]).filter(f=>f.item===p.i.id&&f.sec===p.sec).length;return `<div class="ni"><div><button class="ico" data-goto="${p.id}" data-sec="${p.sec}">${esc(t.name)}</button> <span class="sub">${esc(t.city)}</span></div>
     <div>${esc(tok(p.i.text,t))}${p.x?` → <b>${esc(tok(p.x.text,t))}</b>`:""}</div><div class="sub">Отметил ${esc(p.c.by)} · ${esc(p.c.at)}${ph?` · фото: ${ph}`:""}</div>
     <div class="acts"><button class="btn sm ok" data-confirm="${p.id}|${p.sec}|${p.i.id}|${p.x?p.x.id:""}">Подтвердить</button><button class="btn sm no" data-reject="${p.id}|${p.sec}|${p.i.id}|${p.x?p.x.id:""}">Отклонить</button></div></div>`}).join(""):`<div class="ni sub">Новых отметок нет.</div>`}</div>`;
}
function wavesBar(){
  if(isEng())return "";
  const all=Object.values(S.TT),cnt=w=>all.filter(t=>(t.wave||"")===w).length,none=cnt("");
  const chip=(k,l,n)=>`<button class="wv" role="tab" data-wave="${esc(k)}" aria-selected="${S.wave===k}">${esc(l)} <span class="n">${n}</span></button>`;
  let h=`<div class="waves" role="tablist" aria-label="Волны">`+chip("all","Все ТТ",all.length)+S.waves.map(w=>chip(w.id,w.name,cnt(w.id))).join("")+(none||S.wave===""?chip("","Без волны",none):"");
  if(isAdmin()){
    h+=S.waveNew?`<span class="wv-act"><input type="text" id="wave-new" placeholder="Например: 3 волна" maxlength="40" autocomplete="off"><button class="btn sm pri" data-act="wave-add">Создать вкладку</button><button class="btn sm" data-act="wave-cancel">Отмена</button></span>`
      :`<button class="wv" data-act="wave-new" title="Новая вкладка-волна">＋ Волна</button>`;
    const w=S.waves.find(x=>x.id===S.wave);
    if(w&&!S.waveNew){
      if(S.waveRen)h+=`<span class="wv-act"><input type="text" id="wave-ren" value="${esc(w.name)}" maxlength="40" autocomplete="off"><button class="btn sm pri" data-act="wave-ren-ok">Сохранить</button><button class="btn sm" data-act="wave-cancel">Отмена</button></span>`;
      else if(S.waveDel)h+=`<span class="wv-act"><span class="sub">Удалить вкладку «${esc(w.name)}»? ${cnt(w.id)} ТТ перейдут в «Без волны» — отметки, фото и комментарии сохранятся.</span><button class="btn sm no" data-act="wave-del-ok">Удалить вкладку</button><button class="btn sm" data-act="wave-cancel">Отмена</button></span>`;
      else h+=`<span class="wv-act"><button class="ico" data-act="wave-ren">✎ Переименовать</button><button class="ico danger" data-act="wave-del">🗑 Удалить вкладку</button></span>`;
    }
  }
  return h+`</div>`;
}
function mainView(){
  if(!S.loaded)return `<div class="empty">Загружаю данные…</div>`;
  if(isEng())return engView();
  const list=sortedIds(),pend=allPending().length;
  return wavesBar()+`<div class="toolbar"><input type="search" id="q" placeholder="Поиск: адрес, город, №ТТ, юрлицо, ответственный" value="${esc(S.q)}" aria-label="Поиск">
    <button class="btn" data-act="expand">${S.open.size?"Свернуть все":"Развернуть все"}</button>
    ${isAdmin()?`<button class="btn pri" data-act="new-tt">Добавить ТТ</button>`:""}${S.view==="onsite"&&S.wikiRoot?`<a class="wiki" href="${esc(S.wikiRoot)}" target="_blank" rel="noopener">📘 Инструкции CSI-K V3</a>`:""}</div>
    ${S.newTT?newTTView():""}
    ${isViewer()?`<div class="notice">Режим просмотра: можно открывать чек-листы, календарь и сводку, выгружать Excel. Отмечать и менять ничего нельзя.</div>`:""}
    ${isAdmin()&&pend?`<div class="notice">На проверке у старшего: ${pend} ${plural(pend,"отметка","отметки","отметок")} инженеров.</div>`:""}
    <div class="sub" style="margin-bottom:8px">${list.length} ТТ · ${S.wave==="all"?"все волны":esc(waveName(S.wave))}${S.limited?" · показаны только назначенные вам ТТ":""} · сортировка по дате работ</div>
    <div class="tts">${list.map(id=>ttView(id)).join("")||`<div class="empty">Ничего не найдено.</div>`}</div>`;
}
function engView(){
  const ids=sortedIds(),cur=S.engTT&&S.TT[S.engTT]?S.engTT:"";
  return `<div class="pick"><label class="sub" for="eng-tt">ТТ, на которой я работаю</label>

async function shrink(file){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>res(r.result);r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onerror=rej;i.onload=()=>res(i);i.src=url});
  const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.8);
}

document.addEventListener("keydown",e=>{

  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.subInput){e.preventDefault();document.querySelector(`[data-sub-upd="${e.target.dataset.subInput}"]`)?.click()}

  if(e.key==="Enter"&&e.target.id==="wave-new"){e.preventDefault();document.querySelector(`[data-act="wave-add"]`)?.click()}
  if(e.key==="Enter"&&e.target.id==="wave-ren"){e.preventDefault();document.querySelector(`[data-act="wave-ren-ok"]`)?.click()}
